name: Validate Abwab Tatmain

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check referenced files and dashboard control IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          j=Path('app.js').read_text(encoding='utf-8')
          required=['id="adminSearch"','id="adminSort"','id="adminPrev"','id="adminNext"','id="adminInvitations"','src="app.js?v=admin3"']
          assert all(x in h for x in required), 'Missing dashboard elements'
          assert 'async function adminLoad()' in j, 'Dashboard logic missing'
          assert 'sb_secret_' not in j and 'service_role' not in j, 'Do not commit privileged keys'
          print('Static validation passed')
          PY
